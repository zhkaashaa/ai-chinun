<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এআই চিনুন কুইজ ফলাফল</title>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const score = urlParams.get('score') || '0';
        const total = urlParams.get('total') || '20';
        const percentage = Math.round((parseInt(score) / parseInt(total)) * 100);
        
        let title = "আমি এআই চিনতে পারদর্শী!";
        if (percentage >= 80) title = "অসাধারন! আপনি একজন এআই বিশেষজ্ঞ!";
        else if (percentage >= 50) title = "ভালো চেষ্টা! আপনার জ্ঞান চমৎকার।";
        else title = "আরেকটু চেষ্টা করুন, এআই চেনা কঠিন!";
        
        document.write(`
            <meta property="og:type" content="website">
            <meta property="og:title" content="এআই চিনুন কুইজ ফলাফল: ${score}/${total}">
            <meta property="og:description" content="${title} আপনিও কুইজে অংশ নিন এবং যাচাই করুন!">
            <meta property="og:image" content="https://dummyimage.com/1200x630/4f46e5/ffffff.png&text=AI+Quiz+Result:+${score}/${total}+(${percentage}%)">
            <meta property="og:image:width" content="1200">
            <meta property="og:image:height" content="630">
        `);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-xl">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">এআই চিনুন কুইজ</h1>
        <p class="text-gray-500 mb-6">ফলাফল কার্ড</p>
        <div class="bg-indigo-50 rounded-xl p-6 mb-6 border border-indigo-100">
            <div class="text-5xl font-extrabold text-indigo-600 mb-2" id="score-text"></div>
            <p class="text-lg text-gray-700 font-medium" id="title-text"></p>
        </div>
        <a href="/" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition">
            তুমিও কুইজে অংশ নাও
        </a>
    </div>

    <script>
        document.getElementById('score-text').innerText = `${score} / ${total}`;
        document.getElementById('title-text').innerText = title;
    </script>
</body>
</html>
